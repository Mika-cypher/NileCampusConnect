<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Reset Complete</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card mx-auto" style="max-width: 480px;">
      <div class="card-body text-center">
        <h4 class="card-title mb-3">Password updated</h4>
        <p class="text-muted">
          Your password has been reset successfully. You may now log in with your new password.
        </p>
        <a href="{% url 'core:login' %}" class="btn btn-primary mt-3">
          Back to login
        </a>
      </div>
    </div>
  </div>
</body>
</html>
