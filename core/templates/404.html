{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Nile Campus Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="text-center px-4">
        <div class="mb-4">
            <i class="bi bi-compass text-primary" style="font-size: 5rem; opacity: 0.8;"></i>
        </div>
        <h1 class="display-1 fw-bold text-dark mb-0">404</h1>
        <h4 class="text-secondary mb-4">Looks like you took a wrong turn on campus.</h4>
        <p class="text-muted mb-4 mx-auto" style="max-width: 400px;">
            The gig, profile, or page you are looking for doesn't exist or has been removed.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 fw-semibold rounded-pill shadow-sm">
                <i class="bi bi-arrow-left me-2"></i>Go Back
            </a>
            <a href="/" class="btn btn-primary px-4 fw-semibold rounded-pill shadow-sm">
                <i class="bi bi-house me-2"></i>Return Home
            </a>
        </div>
    </div>

</body>
</html>
