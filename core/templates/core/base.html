{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="{% static 'core/css/custom.css' %}">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar p-0">
                <div class="sidebar-brand">
                    <h3><i class="bi bi-diagram-3-fill"></i> Campus Connect</h3>
                </div>
            
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column px-3">
                        
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'core:dashboard' %}">
                                <i class="bi bi-speedometer2 me-2"></i> Dashboard
                            </a>
                        </li>
            
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'marketplace' %}active{% endif %}" href="{% url 'core:marketplace' %}">
                                <i class="bi bi-shop me-2"></i> Marketplace
                            </a>
                        </li>
            
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'core:dashboard' %}">
                                <i class="bi bi-briefcase me-2"></i> My Gigs
                            </a>
                        </li>
            
                        <li class="nav-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'create_service' %}active{% endif %}" href="{% url 'core:create_service' %}">
                                <i class="bi bi-plus-circle me-2"></i> Post a Gig
                            </a>
                        </li>
            
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                <i class="bi bi-cart3 me-2"></i> My Orders (Buying)
                            </a>
                        </li>
            
                        <li class="nav-item">
                            <a class="nav-link d-flex justify-content-between align-items-center" href="#">
                                <span><i class="bi bi-inbox me-2"></i> Inbox</span>
                                <span class="badge bg-info rounded-pill">3</span>
                            </a>
                        </li>
                        
                        <li class="nav-item">
                            <hr class="text-white opacity-25 mx-2 my-3">
                        </li>
                    
                        <li class="nav-item">
                            <form action="{% url 'core:logout' %}" method="post">
                                {% csrf_token %}
                                <button type="submit" class="nav-link w-100 text-start border-0 bg-transparent">
                                    <i class="bi bi-box-arrow-right me-2"></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto col-lg-10 px-md-4 py-4">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
